version: '3.8'

services:
  noteflow:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime         # use final stage only
    image: noteflow-app:latest
    container_name: noteflow-app
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=noteflow-prod-secret-2025
      - FLASK_ENV=production
    volumes:
      - noteflow-data:/app/data   # persist SQLite database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  noteflow-data:
    driver: local
